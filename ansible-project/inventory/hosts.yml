---
# inventory/hosts.yml
# Management-VLAN (99) SSH addresses for every switch Ansible touches.
# SW-CORE is NOT here - its L3/ACL config is pushed by
# netmiko-scripts/configure_routers.py instead.

all:
  vars:
    ansible_user: "{{ lookup('env', 'ANSIBLE_NET_USERNAME') }}"
    ansible_ssh_pass: "{{ lookup('env', 'ANSIBLE_NET_PASSWORD') }}"
    ansible_become: yes
    ansible_become_method: enable
    ansible_become_password: "{{ lookup('env', 'ANSIBLE_NET_ENABLE_SECRET') }}"
    ansible_network_os: cisco.ios.ios
    ansible_connection: network_cli

  children:
    distribution:
      hosts:
        SW-D-DEIE:
          ansible_host: 10.99.99.11
        SW-D-DCEE:
          ansible_host: 10.99.99.12
        SW-D-DMME:
          ansible_host: 10.99.99.13

    access:
      hosts:
        SW-A-DEIE:
          ansible_host: 10.99.99.21
        SW-A-DCEE:
          ansible_host: 10.99.99.22
        SW-A-DMME:
          ansible_host: 10.99.99.23
        SW-A-DIS:
          ansible_host: 10.99.99.24
